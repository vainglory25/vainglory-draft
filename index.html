<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vainglory Custom Draft Pick Simulator</title>
  <style>
    :root {
      --bg-dark: #090c10;
      --panel-bg: #131924;
      --panel-border: #232d3f;
      --accent-gold: #f59e0b;
      --accent-gold-glow: rgba(245, 158, 11, 0.4);
      --team-home: #3b82f6;
      --team-away: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header Styling */
    header {
      background: linear-gradient(180deg, #182232 0%, #0d131d 100%);
      border-bottom: 2px solid var(--accent-gold);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      z-index: 10;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px var(--accent-gold-glow);
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--accent-gold);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-action:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      box-shadow: 0 0 8px var(--accent-gold-glow);
    }

    .btn-leave {
      background: linear-gradient(135deg, #7f1d1d, #450a0a);
      border-color: #ef4444;
    }

    .btn-leave:hover {
      border-color: #f87171;
      color: #fff;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    /* Status Bar */
    .status-bar {
      background: #0d1117;
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .status-badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: #374151;
      color: #9ca3af;
    }

    .status-badge.ready {
      background: #059669;
      color: #fff;
      box-shadow: 0 0 8px rgba(5, 150, 105, 0.5);
    }

    .timer-box {
      text-align: center;
    }

    .timer-val {
      font-size: 1.8rem
